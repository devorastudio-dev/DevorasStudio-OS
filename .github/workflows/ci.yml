name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Start local Supabase
        run: npm run supabase:start > /dev/null

      - name: Reset local database
        run: npm run supabase:db:reset

      - name: Lint database schema
        run: npm run supabase:db:lint

      - name: Test database authorization
        run: npm run supabase:db:test

      - name: Verify migration schema drift
        run: npm run supabase:db:diff

      - name: Test
        run: npm run test

      - name: Build applications
        run: npm run build
